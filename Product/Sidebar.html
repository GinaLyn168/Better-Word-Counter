<!DOCTYPE html>
<html>
  <head>
    <!-- The UI design was done by Grace -->
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        min-width: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Limelight", Arial, Helvetica, sans-serif;
        font-weight: 100;
        font-style: normal;
        padding: 16px;
        max-height: 100%;
        overflow: hidden;
      }

      h2 {
        color: #444746;
        font-size: 20px;
        margin: 0 0 12px;
      }

      button {
        display: inline-block;
        vertical-align: middle;
        font-family: "Limelight", Arial, Helvetica, sans-serif;
        background: #0B57D0;
        border-radius: 50px;
        border: none;
        color: white;
        font-weight: 400;
        font-style: normal;
        padding: 10px 20px;
        margin: 0 12px 12px 0;
        font-size: 14px;
        cursor: pointer;
      }

      .remove-button {
        background: transparent;
        border: none;
        color: #333;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        margin: 0 0 0 8px;
        font-size: 18px;
        font-weight: 700;
        line-height: 32px;
        padding: 0;
        cursor: pointer;
      }

      .remove-button:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      
      #selectedTextContainer {
        width: 100%;
        box-sizing: border-box;
        max-height: 18vh;
        min-height: 48px;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 8px;
        margin: 10px 0;
        background: transparent;
        border-radius: 14px;
        scrollbar-color: #bbb transparent;
        scrollbar-width: thin;
        font-size: 16px;
        line-height: 1.2;
        color: #666;
        word-break: break-word;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      #selectedTextContainer::-webkit-scrollbar {
        width: 8px;
      }

      #selectedTextContainer::-webkit-scrollbar-track {
        background: transparent;
      }

      #selectedTextContainer::-webkit-scrollbar-thumb {
        background: #bbb;
        border-radius: 4px;
      }

      #selectedTextContainer::-webkit-scrollbar-button {
        display: none;
      }

      #exclusionList {
        width: 100%;
        box-sizing: border-box;
        min-height: 42vh;
        max-height: 42vh;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 10px;
        margin: 10px 0;
        scrollbar-color: #bbb transparent;
        scrollbar-width: thin;
      }

      #exclusionList::-webkit-scrollbar {
        width: 8px;
      }

      #exclusionList::-webkit-scrollbar-track {
        background: transparent;
      }

      #exclusionList::-webkit-scrollbar-thumb {
        background: #bbb;
        border-radius: 4px;
      }

      #exclusionList::-webkit-scrollbar-button {
        display: none;
      }

      .exclusion-item {
        margin: 8px 0;
        padding: 6px 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        line-height: 1.2;
      }

      .exclusion-item .phrase {
        flex: 1;
        margin-right: 8px;
      }

      .exclusion-item.missing .phrase {
        text-decoration: line-through;
        color: #999;
      }

      #exclusionList p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h2>Word count: <span id="wordCount">0</span></h2>
    <button onclick="updateCount()">Refresh Count</button>

    <h2>Selected Text</h2>
    <div id="selectedTextContainer"><span id="selectedText">None</span></div>
    <button onclick="updateSelectedText()">Refresh</button>
    <button onclick="saveExclusion()">Exclude</button>
    <button onclick="clearExclusions()">Clear All</button>

    <hr>
    <h2>Excluded Phrases</h2>
    <div id="exclusionList"></div>

    <script>
      function updateCount() {
        google.script.run
          .withSuccessHandler(count => {
            document.getElementById('wordCount').innerText = count;
          })
          .getWordCount();
      }

      function updateSelectedText() {
        google.script.run
          .withSuccessHandler(text => {
            document.getElementById('selectedText').innerText = text || 'None';
          })
          .getSelectedText();
      }

      // Function made by Ranbir, minimal AI use to understand how to save the exclusion and syntax
      function saveExclusion() {
        const phrase = document.getElementById('selectedText').innerText;
        if (phrase === 'None' || phrase.trim() === '') return;
        google.script.run
          .withSuccessHandler(exclusions => {
            displayExclusions(exclusions);
          })
          .saveExclusion(phrase);
      }

      // Function made by Ranbir, minimal AI use to understand how to save the exclusion and syntax
      function clearExclusions() {
        google.script.run
          .withSuccessHandler(exclusions => {
            displayExclusions(exclusions);
          })
          .clearExclusions();
      }

      // Function made by both AI and Ranbir prominently
      function displayExclusions(exclusions) {
        const list = document.getElementById('exclusionList');
        list.innerHTML = '';
        exclusions.forEach(item => {
          const phrase = item.phrase || item;
          const missing = item.missing === true;
          const p = document.createElement('p');
          p.className = 'exclusion-item' + (missing ? ' missing' : '');

          const phraseSpan = document.createElement('span');
          phraseSpan.className = 'phrase';
          phraseSpan.textContent = phrase;
          p.appendChild(phraseSpan);

          const btn = document.createElement('button');
          btn.textContent = '×';
          btn.className = 'remove-button';
          btn.dataset.phrase = phrase;
          btn.addEventListener('click', function() {
            removeExclusion(this.dataset.phrase);
          });
          p.appendChild(btn);
          list.appendChild(p);
        });
      }

      // Function made by Ranbir, following model of other functions
      function removeExclusion(phrase) {
        google.script.run
          .withSuccessHandler(exclusions => {
            displayExclusions(exclusions);
          })
          .removeExclusion(phrase);
      }

      // Function made by Ranbir, following model of other functions
      function loadExclusions() {
        google.script.run
          .withSuccessHandler(exclusions => {
            if (exclusions && exclusions.length > 0) {
              displayExclusions(exclusions);
            }
          })
          .getExclusions();
      }

      updateCount();
      setInterval(updateCount, 1000);
      updateSelectedText();
      setInterval(updateSelectedText, 1000);
      loadExclusions();
      setInterval(loadExclusions, 1000);

    </script>
  </body>
</html>
