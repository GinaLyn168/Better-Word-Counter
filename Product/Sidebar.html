<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: "Limelight", Arial, Helvetica, sans-serif;
        font-weight: 100;
        font-style: normal;
      }
      h2 {
        color: #444746;
        font-size: 20px;
      }
      button {
        font-family: "Limelight", Arial, Helvetica, sans-serif;
        /* New start */
        background: #0B57D0; 
        border-radius: 50px;
        border: none;
        color: white;
        /* New end */
        font-weight: 50;
        font-style: normal;
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Word count: <span id="wordCount">0</span></h2>
    <button onclick="updateCount()">Refresh Count</button>
    
    <script>
      function updateCount() {
        google.script.run
          .withSuccessHandler(count => {
            document.getElementById('wordCount').innerText = count;
          })
          .getWordCount();
      }

      updateCount();
      setInterval(updateCount, 1000);
    </script>
    <!-- modified --> <h2>Selected text: <span id="selectedText">None</span></h2>
    <button onclick="updateSelectedText()">Refresh Selected Text</button>
    <script>
      function updateSelectedText() {
        google.script.run
          .withSuccessHandler(text => {
            document.getElementById('selectedText').innerText = text || 'None';
          })
          .getSelectedText();
      }

        updateSelectedText();
        setInterval(updateSelectedText, 1000);
    </script>
    <<button onclick="saveExclusion()" style="margin-top: 12px; display: block;">Exclude Selected Text</button>

    <script>
      function saveExclusion() {
        google.script.run
          .withSuccessHandler(exclusions => {
            displayExclusions(exclusions);
          })
          .saveExclusion(document.getElementById('selectedText').innerText);
      }

      function displayExclusions(exclusions) {
        const list = document.getElementById('exclusionList');
        list.innerHTML = '';
        for (const phrase of exclusions) {
          list.innerHTML += `<p>${phrase}</p>`;
        }
      }
    </script>
    <div id="exclusionList"></div>

    <button onclick="debug()">Debug</button>
    <p id="debugOutput"></p>

    <script>
      function debug() {
        google.script.run
          .withSuccessHandler(result => {
            document.getElementById('debugOutput').innerText = result;
          })
          .debugWordCount();
      }
    </script>
  </body>
</html>
