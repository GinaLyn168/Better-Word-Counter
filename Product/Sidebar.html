<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="sidebarCSS.css">
  </head>
  <body>
    <h2>Better Word Counter</h2>
    <p>Word count: <span id="wordCount">0</span></p>
    <button onclick="updateCount()">Refresh Count</button>

    <script>
      function updateCount() {
        google.script.run
          .withSuccessHandler(count => {
            document.getElementById('wordCount').innerText = count;
          })
          .getWordCount();
      }

      updateCount();
      setInterval(updateCount, 1000);


    </script>
    <p>Selected text: <span id="selectedText">None</span></p>
    <button onclick="updateSelectedText()">Refresh Selected Text</button>
    <script>
      function updateSelectedText() {
        google.script.run
          .withSuccessHandler(text => {
            document.getElementById('selectedText').innerText = text || 'None';
          })
          .getSelectedText();
      }
    </script>
  </body>
</html>
